name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build and smoke test without Codex
        shell: bash
        env:
          CCODEX_REF_TYPE: ${{ github.ref_type }}
          CCODEX_REF_NAME: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          ccodex_version=0.0.0-ci
          if [[ "$CCODEX_REF_TYPE" == tag ]]; then
            [[ "$CCODEX_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            ccodex_version="${CCODEX_REF_NAME#v}"
          fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/xoba/ccodex/internal/buildinfo.Version=${ccodex_version}" \
            -o "$RUNNER_TEMP/ccodex" .
          test "$("$RUNNER_TEMP/ccodex" --codex-bin "$RUNNER_TEMP/missing-codex" --version)" = "ccodex version ${ccodex_version}"
          "$RUNNER_TEMP/ccodex" --codex-bin "$RUNNER_TEMP/missing-codex" --help
          "$RUNNER_TEMP/ccodex" watch --codex-bin "$RUNNER_TEMP/missing-codex" --help
          "$RUNNER_TEMP/ccodex" history path
          "$RUNNER_TEMP/ccodex" history
